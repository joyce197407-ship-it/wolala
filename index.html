<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作 / 休息計時器</title>
  <style>
    /* 全局樣式重置與變數 */
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --work-color: #ef4444;
      --rest-color: #10b981;
      --warning-bg: #fee2e2;
      --warning-text: #dc2626;
      --border-color: #e5e7eb;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 主要卡片容器 */
    .timer-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    /* 設定區域 */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .full-width {
      grid-column: span 2;
    }

    /* 錯誤與警告訊息 */
    .error-message {
      background-color: var(--warning-bg);
      color: var(--warning-text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .error-message.visible {
      display: block;
    }

    /* 計時顯示區域 */
    .display-container {
      margin: 28px 0;
      padding: 24px;
      background-color: #fafafa;
      border-radius: 12px;
      border: 1px solid #f0f0f0;
    }

    .phase-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      transition: background-color 0.3s, color 0.3s;
    }

    .phase-badge.work {
      background-color: #fee2e2;
      color: var(--work-color);
    }

    .phase-badge.rest {
      background-color: #d1fae5;
      color: var(--rest-color);
    }

    .time-display {
      font-size: 4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      color: var(--text-main);
      line-height: 1;
    }

    /* 按鈕控制器 */
    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
    }

    .btn-start:hover {
      background-color: var(--primary-hover);
    }

    .btn-pause {
      background-color: #f3f4f6;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-pause:hover {
      background-color: #e5e7eb;
    }

    .btn-reset {
      background-color: #f3f4f6;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-reset:hover {
      background-color: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <h1 class="title">工作 / 休息計時器</h1>

    <!-- 設定區域 -->
    <div class="settings-grid">
      <div class="input-group">
        <label for="work-time">工作時間 (分)</label>
        <input type="number" id="work-time" value="25" min="1" max="180">
      </div>
      <div class="input-group">
        <label for="rest-time">休息時間 (分)</label>
        <input type="number" id="rest-time" value="5" min="1" max="180">
      </div>
      <div class="input-group full-width">
        <label for="current-phase">目前階段</label>
        <select id="current-phase">
          <option value="work">工作時間</option>
          <option value="rest">休息時間</option>
        </select>
      </div>
    </div>

    <!-- 驗證錯誤訊息提示區 -->
    <div id="error-message" class="error-message">
      請輸入 1 到 180 之間的有效整數。
    </div>

    <!-- 倒數顯示區域 -->
    <div class="display-container">
      <div id="phase-badge" class="phase-badge work">工作中</div>
      <div id="time-display" class="time-display">25:00</div>
    </div>

    <!-- 控制按鈕區域 -->
    <div class="controls">
      <button id="btn-start" class="btn btn-start">開始</button>
      <button id="btn-pause" class="btn btn-pause">暫停</button>
      <button id="btn-reset" class="btn btn-reset">重設</button>
    </div>
  </div>

  <script>
    // DOM 元素引用
    const workInput = document.getElementById('work-time');
    const restInput = document.getElementById('rest-time');
    const phaseSelect = document.getElementById('current-phase');
    const errorMessage = document.getElementById('error-message');
    const phaseBadge = document.getElementById('phase-badge');
    const timeDisplay = document.getElementById('time-display');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');

    // 狀態變數
    let timerId = null;            // 存放 setInterval 的 ID
    let remainingSeconds = 25 * 60; // 目前剩餘秒數
    let isRunning = false;          // 計時器是否運行中

    // 驗證輸入內容 (1 - 180 的整數)
    function validateInput(value) {
      if (value === '' || isNaN(value)) return false;
      const num = Number(value);
      return Number.isInteger(num) && num >= 1 && num <= 180;
    }

    // 格式化秒數為 MM:SS
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const padM = String(minutes).padStart(2, '0');
      const padS = String(seconds).padStart(2, '0');
      return `${padM}:${padS}`;
    }

    // 取得當前選擇階段對應的輸入分鐘數
    function getCurrentPhaseMinutes() {
      const isWork = phaseSelect.value === 'work';
      const inputEl = isWork ? workInput : restInput;
      const val = inputEl.value;

      if (!validateInput(val)) {
        errorMessage.classList.add('visible');
        return null;
      }

      errorMessage.classList.remove('visible');
      return parseInt(val, 10);
    }

    // 更新畫面 UI (時間顯示與階段標籤)
    function updateUI() {
      const isWork = phaseSelect.value === 'work';
      
      // 更新階段標籤
      phaseBadge.textContent = isWork ? '工作時間' : '休息時間';
      phaseBadge.className = `phase-badge ${isWork ? 'work' : 'rest'}`;

      // 防止顯示負數
      const displaySec = Math.max(0, remainingSeconds);
      timeDisplay.textContent = formatTime(displaySec);
    }

    // 重設計時器 (回到目前階段設定的時間)
    function resetTimer() {
      // 1. 停止倒數
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;

      // 2. 重新讀取設定時間
      const minutes = getCurrentPhaseMinutes();
      if (minutes !== null) {
        remainingSeconds = minutes * 60;
      } else {
        remainingSeconds = 0;
      }

      // 3. 更新畫面
      updateUI();
    }

    // 開始倒數
    function startTimer() {
      // 防止重複點擊「開始」疊加定時器
      if (isRunning) return;

      // 確保設定值合法
      const minutes = getCurrentPhaseMinutes();
      if (minutes === null) return;

      // 如果時間已經倒數到 0，按開始時重新載入當前設定
      if (remainingSeconds <= 0) {
        remainingSeconds = minutes * 60;
        updateUI();
      }

      isRunning = true;
      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateUI();
        }

        // 時間到處理
        if (remainingSeconds <= 0) {
          clearInterval(timerId);
          timerId = null;
          isRunning = false;
          remainingSeconds = 0;
          updateUI();
        }
      }, 1000);
    }

    // 暫停倒數
    function pauseTimer() {
      if (!isRunning) return;

      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;
      // remainingSeconds 保持原樣不修改，達成保留時間的效果
    }

    // --- 事件監聽配置 ---

    // 按鈕點擊
    btnStart.addEventListener('click', startTimer);
    btnPause.addEventListener('click', pauseTimer);
    btnReset.addEventListener('click', resetTimer);

    // 下拉選單切換階段
    phaseSelect.addEventListener('change', resetTimer);

    // 輸入框數值變更時即時驗證與更新
    [workInput, restInput].forEach(input => {
      input.addEventListener('input', () => {
        const isWork = phaseSelect.value === 'work';
        const currentInput = isWork ? workInput : restInput;

        // 當修改的是「目前階段」對應的數值時，更新顯示
        if (input === currentInput) {
          if (!isRunning) {
            resetTimer();
          } else {
            // 若正在運作中僅做欄位驗證
            const val = input.value;
            if (!validateInput(val)) {
              errorMessage.classList.add('visible');
            } else {
              errorMessage.classList.remove('visible');
            }
          }
        } else {
          // 修改非目前階段數值，僅校驗錯誤提示
          const val = input.value;
          if (!validateInput(val)) {
            errorMessage.classList.add('visible');
          } else {
            // 檢查另一個欄位是否正常，正常才隱藏警告
            const otherVal = currentInput.value;
            if (validateInput(otherVal)) {
              errorMessage.classList.remove('visible');
            }
          }
        }
      });
    });

    // 初始化顯示
    resetTimer();
  </script>
</body>
</html>
